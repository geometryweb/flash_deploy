<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>yong_hyewon_4_video_poems_20080527_duri - Flash Player</title>
  <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
  <style>
    :root {
      --bg-page: #f8fafc;
      --bg-card: #ffffff;
      --border-pastel: #e2e8f0;
      --border-hover: #bae6fd;
      --text-main: #0f172a;
      --text-sub: #475569;
      --text-muted: #94a3b8;
      --sky-primary: #0284c7;
      --sky-primary-hover: #0369a1;
      --sky-soft: #e0f2fe;
      --sky-chip-text: #0369a1;
      --shadow-card: 0 10px 30px -10px rgba(15, 23, 42, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Noto Sans KR", "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-page);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      line-height: 1.5;
    }

    .modern-card {
      width: 100%;
      max-width: 780px;
      background-color: var(--bg-card);
      border: 1px solid var(--border-pastel);
      border-radius: 20px;
      box-shadow: var(--shadow-card);
      padding: 24px;
      transition: border-color 0.25s ease, box-shadow 0.25s ease;
    }

    .modern-card:hover {
      border-color: var(--border-hover);
      box-shadow: 0 14px 36px -12px rgba(2, 132, 199, 0.12);
    }

    .card-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }

    .title-group h1 {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.02em;
    }

    .title-group p {
      font-size: 0.85rem;
      color: var(--text-sub);
      margin-top: 2px;
    }

    .btn-unmute {
      appearance: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      background-color: var(--sky-soft);
      color: var(--sky-chip-text);
      border: 1px solid var(--border-hover);
      font-size: 0.8rem;
      font-weight: 600;
      border-radius: 999px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .btn-unmute:hover {
      background-color: var(--sky-primary);
      color: #ffffff;
      border-color: var(--sky-primary);
    }

    .btn-unmute.is-unmuted {
      background-color: #f1f5f9;
      color: var(--text-sub);
      border-color: var(--border-pastel);
      cursor: default;
    }

    .viewport-box {
      width: 100%;
      aspect-ratio: 720 / 520;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid var(--border-pastel);
      background-color: #f1f5f9;
      background-image:
        linear-gradient(45deg, #e2e8f0 25%, transparent 25%),
        linear-gradient(-45deg, #e2e8f0 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #e2e8f0 75%),
        linear-gradient(-45deg, transparent 75%, #e2e8f0 75%);
      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .viewport-box #ruffleMount {
      width: 100%;
      height: 100%;
    }

    .viewport-box ruffle-player {
      width: 100%;
      height: 100%;
      display: block;
    }

    .loading-overlay {
      position: absolute;
      inset: 0;
      background: rgba(248, 250, 252, 0.92);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      z-index: 10;
      transition: opacity 0.25s ease, visibility 0.25s ease;
    }

    .loading-overlay.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loading-text {
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--sky-chip-text);
    }

    .loading-bar-track {
      width: 220px;
      max-width: 70%;
      height: 8px;
      background-color: #e2e8f0;
      border-radius: 999px;
      overflow: hidden;
    }

    .loading-bar-fill {
      width: 45%;
      height: 100%;
      background: linear-gradient(90deg, #38bdf8 0%, #0284c7 100%);
      border-radius: 999px;
      animation: loadingSlide 1.1s ease-in-out infinite;
    }

    @keyframes loadingSlide {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(240%); }
    }

    .controls-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 18px;
    }

    .btn-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn {
      appearance: none;
      border: 1px solid transparent;
      border-radius: 10px;
      padding: 9px 16px;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(2, 132, 199, 0.22);
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, #0ea5e9 0%, #0369a1 100%);
    }

    .btn-ghost {
      background-color: #ffffff;
      color: #475569;
      border-color: #cbd5e1;
    }

    .btn-ghost:hover {
      background-color: #f0f9ff;
      border-color: #bae6fd;
      color: #0284c7;
    }

    .meta-info {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
      font-family: ui-monospace, Menlo, Consolas, monospace;
    }

    .wm-app-footer {
      width: 100%;
      max-width: 780px;
      margin-top: 14px;
      padding: 12px 0 0 0;
      border-top: 1px solid #e2e8f0;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .footer-content {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.79rem;
      color: #64748b;
      flex-wrap: wrap;
      justify-content: center;
    }

    .footer-divider {
      color: #cbd5e1;
    }

    .footer-blog-link {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: #0284c7;
      font-size: 0.79rem;
      font-weight: 600;
      text-decoration: none;
      padding: 2.5px 8px;
      border-radius: 6px;
      background: #f0f9ff;
      border: 1px solid #bae6fd;
      cursor: pointer;
    }

    .footer-blog-link:hover {
      background: #e0f2fe;
    }

    @media (max-width: 600px) {
      .modern-card { padding: 16px; border-radius: 16px; }
      .controls-bar { flex-direction: column; align-items: stretch; }
      .btn-group { width: 100%; }
      .btn { flex: 1; justify-content: center; }
      .meta-info { text-align: center; }
    }
  </style>
</head>
<body>
  <main class="modern-card">
    <header class="card-header">
      <div class="title-group">
        <h1>yong_hyewon_4_video_poems_20080527_duri</h1>
        <p>Pastel Sky v2.0 · Ruffle Flash Player</p>
      </div>
      <button type="button" class="btn-unmute" id="btnUnmute">
        🔇 클릭해서 음소거 해제
      </button>
    </header>

    <section class="viewport-box" id="playerContainer" aria-label="플래시 플레이어 뷰포트">
      <div id="ruffleMount"></div>
      <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-text">플래시 불러오는 중...</div>
        <div class="loading-bar-track">
          <div class="loading-bar-fill"></div>
        </div>
      </div>
    </section>

    <div class="controls-bar">
      <div class="btn-group">
        <button type="button" class="btn btn-primary" id="btnReload">다시 불러오기</button>
        <button type="button" class="btn btn-ghost" id="btnFullscreen">전체화면</button>
      </div>
      <span class="meta-info">해상도 720 × 520 px · Vanilla JS + Ruffle</span>
    </div>
  </main>

  <footer class="wm-app-footer">
    <div class="footer-content">
      <span>Copyright © 2026 Kim Jeongman. All rights reserved.</span>
      <span class="footer-divider">|</span>
      <a href="https://blog.naver.com/jungman3" target="_blank" rel="noopener noreferrer" class="footer-blog-link">
        <span class="blog-icon">📗</span> Naver Blog
      </a>
    </div>
  </footer>

  <script>
    const SWF_URL = "./yong_hyewon_4_video_poems_20080527_duri.swf";

    function mountRufflePlayer() {
      const mount = document.getElementById("ruffleMount");
      const loadingOverlay = document.getElementById("loadingOverlay");
      const btnUnmute = document.getElementById("btnUnmute");

      if (loadingOverlay) {
        loadingOverlay.classList.remove("is-hidden");
      }

      if (!window.RufflePlayer) {
        return;
      }

      const ruffle = window.RufflePlayer.newest();
      const player = ruffle.createPlayer();
      mount.innerHTML = "";
      mount.appendChild(player);

      if (btnUnmute) {
        btnUnmute.classList.remove("is-unmuted");
        btnUnmute.textContent = "🔇 클릭해서 음소거 해제";
      }

      player.load({
        url: SWF_URL,
        autoplay: "on",
        unmuteOverlay: "hidden",
        splashScreen: false,
        letterbox: "on",
      }).then(() => {
        if (loadingOverlay) {
          loadingOverlay.classList.add("is-hidden");
        }
      }).catch((err) => {
        console.error("SWF 로드 오류:", err);
        if (loadingOverlay) {
          loadingOverlay.classList.add("is-hidden");
        }
      });
    }

    document.addEventListener("DOMContentLoaded", () => {
      mountRufflePlayer();

      const btnReload = document.getElementById("btnReload");
      const btnFullscreen = document.getElementById("btnFullscreen");
      const btnUnmute = document.getElementById("btnUnmute");
      const container = document.getElementById("playerContainer");

      btnUnmute.addEventListener("click", () => {
        const player = container.querySelector("ruffle-player");
        if (player) {
          player.volume = 1;
          const target =
            (player.shadowRoot &&
              (player.shadowRoot.querySelector("#container") ||
                player.shadowRoot.querySelector("canvas"))) ||
            player;
          target.dispatchEvent(
            new MouseEvent("click", {
              bubbles: true,
              composed: true,
              cancelable: true,
              view: window,
            })
          );
        }
        btnUnmute.classList.add("is-unmuted");
        btnUnmute.textContent = "🔊 소리 켜짐";
      });

      btnReload.addEventListener("click", () => {
        mountRufflePlayer();
      });

      btnFullscreen.addEventListener("click", () => {
        const player = container.querySelector("ruffle-player");
        if (player && typeof player.enterFullscreen === "function") {
          player.enterFullscreen();
        } else if (container.requestFullscreen) {
          container.requestFullscreen();
        }
      });
    });
  </script>
</body>
</html>
